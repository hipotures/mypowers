[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mypowers"
version = "0.1.0"
description = "Local ALLPOWERS S300 monitoring and verified output control"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = ["pydantic>=2.12,<3", "python-dotenv>=1.1,<2"]

[project.optional-dependencies]
server = ["bleak==3.0.2", "dbus-fast==3.1.2", "fastapi>=0.118,<1", "uvicorn>=0.37,<1", "aiosqlite>=0.21,<1", "PyYAML>=6.0.3,<7", "websockets>=15,<18"]
cli = ["rich>=14,<15", "httpx>=0.28,<1", "websockets>=15,<18", "tzdata"]

[project.scripts]
mypowersd = "mypowers.entrypoints:daemon"
mypowers = "mypowers.entrypoints:cli"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "pytest-cov>=6,<8",
    "ruff",
    "mypy",
    "types-PyYAML",
    "build",
    "pip-audit",
    "pyte>=0.8.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mypowers", "frontends/cli/src/mypowers_cli"]

[tool.hatch.build.targets.sdist]
exclude = ["**/target/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["hardware: explicit real-station opt-in tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src", "frontends/cli/src"]

[tool.coverage.run]
branch = true
source = ["mypowers", "mypowers_cli"]
