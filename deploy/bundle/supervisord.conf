[unix_http_server]
file=/run/mypowers-supervisor.sock
chmod=0600

[supervisord]
nodaemon=true
user=root
logfile=/var/log/mypowers/supervisor.log
logfile_maxbytes=5MB
logfile_backups=3
pidfile=/run/mypowers-supervisor.pid
childlogdir=/var/log/mypowers

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/mypowers-supervisor.sock

[program:mypowers]
environment=BLEAK_DBUS_AUTH_UID="-1",DBUS_SYSTEM_BUS_ADDRESS="unix:path=/host-dbus/system_bus_socket"
command=/opt/mypowers/current/venv/bin/mypowersd --env-file /etc/mypowers/server.env
user=mypowers
directory=/var/lib/mypowers
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=20
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/mypowers/daemon-console.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3

[program:caddy]
command=/bin/sh -c '. /etc/conf.d/caddy; exec /usr/sbin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile'
directory=/root
environment=HOME="/root",XDG_DATA_HOME="/root/.local/share",XDG_CONFIG_HOME="/root/.config"
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=20
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/mypowers/caddy.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
