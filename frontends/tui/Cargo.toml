[package]
name = "mypowers-tui"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "mypowers-tui"

[[bench]]
name = "render"
harness = false

[dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
# Raw descriptor polling avoids stalled Unix input bursts with Crossterm's Mio source.
crossterm = { version = "0.29.0", default-features = false, features = ["events", "bracketed-paste", "use-dev-tty"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal", "process", "io-util"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
chrono-tz = "0.10"
ratcn = "=0.0.5"
config = { version = "0.15", default-features = false, features = ["toml"] }
toml = { version = "1", features = ["serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
