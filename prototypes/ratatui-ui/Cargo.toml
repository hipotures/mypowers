[package]
name = "mypowers-ratatui"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29.0", default-features = false, features = ["events"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
